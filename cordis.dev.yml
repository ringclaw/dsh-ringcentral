# 本地开发用 patch overlay 模板（绝对路径加载构建产物，无需预装插件）
#
# 注意：name 路径按 dsh 的 profile 目录解析，不能是相对路径。
# 请先运行 `pnpm build && node scripts/gen-dev-patch.mjs` 生成本机路径的
# cordis.local.yml，或手动把 /path/to/dsh-ringcentral 替换为本仓库绝对路径。
#
# 为什么是 dist/index.js 而不是 src/index.ts：
# npx 安装的 @deepseek-ai/dsh 无法把 import './x.js' 解析到 ./x.ts，
# 直接加载 .ts 入口会报 Cannot find module。构建产物 + tsc --watch 重建，
# loader 检测到文件变化会自动热重载，开发体验一致。
#
# 用法：
#   export RC_BOT_TOKEN="你的 Bot JWT"
#   pnpm build
#   node scripts/gen-dev-patch.mjs
#   npx @deepseek-ai/dsh web --patch ./cordis.local.yml

# 若 profile 已装插件，先禁用 bundle 层插入的那一行（未装则此行被跳过）
- id: im-ringcentral
  disabled: true

# 源码版本用唯一 id，避免与 bundle 层同 id 冲突；其余配置走 Schema 默认值
- insert:
    - id: im-ringcentral-dev
      name: '/path/to/dsh-ringcentral/dist/index.js'
      config:
        botToken: __FROM_ENV__
        server: __FROM_ENV__
        processingPlaceholder:
          enabled: true
        debug: true
