# dsh-im-ringcentral 组合配置示例
#
# 运行: dsh --config ./cordis.yml
#
# 密钥类环境变量（插件直接读取的只有这些）:
#   RC_BOT_TOKEN        - RingCentral Bot 静态 JWT（必填）
#   RC_SERVER_URL       - RingCentral API 服务器（可选，默认 production）
#   RC_USER_CLIENT_ID / RC_USER_CLIENT_SECRET / RC_USER_JWT_TOKEN
#                       - 可选 owner JWT，启用 ringcentral_get_recent_messages
#                         历史工具与出站回退
#   DEEPSEEK_API_KEY    - DeepSeek API Key（LLM 适配器）
#
# 行为配置全部来自本配置树（Schema 默认值见 src/config.ts）；需要环境变量
# 驱动的行为配置，用 ${VAR} 插值即可，例如：
#   access:
#     groupMode: ${RC_GROUP_MODE:-open}

# ── 核心 spine ──
- id: sessions
  name: '@deepseek-ai/dsh-session'

- id: agent
  name: '@deepseek-ai/dsh-agent'

- id: agent-loop
  name: '@deepseek-ai/dsh-agent-loop'

- id: system-prompt
  name: '@deepseek-ai/dsh-system-prompt'

- id: tools
  name: '@deepseek-ai/dsh-tools'

# ── LLM 适配器 ──
- id: llm-deepseek
  name: '@deepseek-ai/dsh-llm-deepseek'
  config:
    apiKey: ${DEEPSEEK_API_KEY}

# ── 执行能力（按需启用） ──
- id: tool-bash
  name: '@deepseek-ai/dsh-tool-bash'

- id: tool-fs
  name: '@deepseek-ai/dsh-tool-fs'

- id: tool-web
  name: '@deepseek-ai/dsh-tool-web'

# ── 上下文管理 ──
- id: compaction
  name: '@deepseek-ai/dsh-compaction-basic'

- id: token-meter
  name: '@deepseek-ai/dsh-token-meter'

# ── 持久化 ──
- id: session-persistence
  name: '@deepseek-ai/dsh-session-persistence-jsonl'
  config:
    root: ./.dsh-sessions

# ── RingCentral IM 驱动（只写与默认值不同的项） ──
- id: im-ringcentral
  name: 'dsh-ringcentral'
  config:
    botToken: ${RC_BOT_TOKEN}
    server: ${RC_SERVER_URL:-https://platform.ringcentral.com}
    access:
      groupMode: allowlist
      groupAllow:
        - 123456789
    requireMention: true
    processingPlaceholder:
      enabled: true
    provider: deepseek
    model: deepseek-chat
