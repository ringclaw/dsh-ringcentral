# profile cordis.patch.yml 示例（用户覆盖层）
#
# 叠加顺序：dsh-base → 本插件 bundle patch → 本文件 → ~/.dsh/cordis.patch.yml → --patch
# 注意：同 id 条目会【整块替换】config，因此必须保留密钥占位（__FROM_ENV__），
# 否则环境变量注入失效。
#
# 用法：
#   1. npx @deepseek-ai/dsh plugin --profile ringcentral add dsh-ringcentral
#   2. 把本文件内容合并进 ~/.dsh/profiles/ringcentral/cordis.patch.yml
#   3. export RC_BOT_TOKEN="你的 Bot JWT"（owner 凭据可选）
#   4. npx @deepseek-ai/dsh --profile ringcentral

- id: im-ringcentral
  config:
    # ── 密钥占位（环境变量注入；保留勿删） ──
    botToken: __FROM_ENV__
    server: __FROM_ENV__
    ownerCredentials:
      clientId: __FROM_ENV__
      clientSecret: __FROM_ENV__
      jwt: __FROM_ENV__

    # ── 访问控制（对齐 dsh-qqbot；空白名单或含 "*" = 全部放行） ──
    access:
      dmMode: allowlist          # disabled / allowlist / open
      dmAllow:
        - "1234567890"           # 允许私聊 bot 的 RingCentral person id（替换为真实 id）
        - "9876543210"
      groupMode: allowlist       # 生产建议 allowlist
      groupAllow:
        - "0123456789"           # 允许的 Team/Everyone/Group chat id（替换为真实 id）

    # ── 门控与提示词 ──
    requireMention: true         # 群聊需要 @bot 触发
    groupPrompt: "你是团队客服机器人，请用中文简洁回复。"
    directPrompt: ""             # 私聊额外 system prompt（可选）

    # ── 其余常用（缺省走 Schema 默认值，这里显式列出便于阅读） ──
    processingPlaceholder:
      enabled: true              # 处理期间发 👀 → ⏳
    textChunkLimit: 4000
    sessionIdleTimeout: 1800000
    showToolResults: false
    debug: false
