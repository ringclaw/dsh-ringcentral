# dsh-im-ringcentral bundle patch
#
# 当本包通过 dsh plugin --profile <name> add dsh-ringcentral 安装后，
# dsh 启动时自动加载此 patch。
#
# 叠加顺序：dsh-base → 本 bundle patch → profile cordis.patch.yml → --patch
#
# 密钥通过 loader 的 !!js 标签从环境变量取值（必须双感叹号，单 !js 不求值）：
# 未设置的变量求值为 undefined，Schemastery 落到默认值 ''（视为未配置）。
# owner 凭据（RC_USER_*）不在此声明：运行时按需从环境变量读取。

- insert:
    - id: im-ringcentral
      name: 'dsh-ringcentral'
      config:
        botToken: !!js process.env.RC_BOT_TOKEN
        server: !!js process.env.RC_SERVER_URL
