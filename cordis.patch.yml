# dsh-im-ringcentral bundle patch
#
# 当本包通过 dsh plugin --profile <name> add dsh-ringcentral 安装后，
# dsh 启动时自动加载此 patch。
#
# 叠加顺序：dsh-base → 本 bundle patch → profile cordis.patch.yml → --patch
#
# 行为配置遵循 dsh 最佳实践：这里只放密钥占位（__FROM_ENV__），其余全部走
# Config Schema 默认值；需要自定义时在 profile 自己的 cordis.patch.yml 覆盖
# 对应条目（loader 的 !!js 标签支持环境变量求值）。

# ── 插入 im-ringcentral 插件行 ──
- insert:
    - id: im-ringcentral
      name: 'dsh-ringcentral'
      config:
        botToken: __FROM_ENV__
        server: __FROM_ENV__
        ownerCredentials:
          clientId: __FROM_ENV__
          clientSecret: __FROM_ENV__
          jwt: __FROM_ENV__
